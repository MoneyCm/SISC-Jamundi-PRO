services:
  # El servicio de base de datos interna de Render ha sido eliminado 
  # porque expira el 05-03-2026. Ahora usamos NEON (PostgreSQL Serverless).

  # Backend (SISC-Jamundí API)
  - type: web
    name: sisc-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SISC_REPORT_TRIGGER_KEY
        generateValue: true
      - key: SISC_SOURCE_MONITOR_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sisc-frontend.onrender.com
      - key: AI_PROVIDER
        value: GEMINI
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

  # Frontend (SISC-Jamundí Web)
  - type: static
    name: sisc-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sisc-backend
          property: url
